name: Build & Deploy to LKE

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bookstore

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend, ai-service]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./akamai-bookstore/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}

  build-seeder:
    name: Build & push seeder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push seeder
        uses: docker/build-push-action@v5
        with:
          context: ./akamai-bookstore
          file: ./akamai-bookstore/seeder/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-seeder:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-seeder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to LKE
    needs: [build-and-push, build-seeder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install nginx-ingress controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --set controller.service.type=LoadBalancer

          # Wait for controller pods to be ready
          kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx --timeout=5m

          # Wait for NodeBalancer IP (LKE provisioning can take up to 8 min)
          echo "Waiting for NodeBalancer IP..."
          for i in $(seq 1 48); do
            IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "NodeBalancer IP: $IP"
              break
            fi
            echo "  attempt $i/48 — not ready yet, waiting 10s..."
            sleep 10
          done
          if [ -z "$IP" ]; then
            echo "::warning::Timed out waiting for NodeBalancer IP. Continuing with in-cluster deployment; public ingress will remain pending until the Linode NodeBalancer service limit is raised or an existing NodeBalancer is removed."
          fi

      - name: Apply base Kubernetes resources
        run: |
          kubectl apply -f akamai-bookstore/k8s/namespace.yaml

          kubectl create secret generic app-secrets \
            -n bookstore \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.PROD_POSTGRES_PASSWORD }}' \
            --from-literal=MEILI_MASTER_KEY='${{ secrets.PROD_MEILI_MASTER_KEY }}' \
            --from-literal=LLM_API_KEY='${{ secrets.LLM_API_KEY }}' \
            --from-literal=HF_TOKEN='${{ secrets.HF_TOKEN }}' \
            --from-literal=AKAMAI_ACCESS_KEY='${{ secrets.AKAMAI_ACCESS_KEY }}' \
            --from-literal=AKAMAI_SECRET_KEY='${{ secrets.AKAMAI_SECRET_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f akamai-bookstore/k8s/configmaps/

          kubectl create configmap postgres-init \
            -n bookstore \
            --from-file=init.sql=akamai-bookstore/scripts/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create configmap keycloak-realm \
            -n bookstore \
            --from-file=realm.json=akamai-bookstore/scripts/keycloak-realm.json \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f akamai-bookstore/k8s/postgres/
          kubectl apply -f akamai-bookstore/k8s/redis/
          kubectl apply -f akamai-bookstore/k8s/meilisearch/
          kubectl apply -f akamai-bookstore/k8s/keycloak/
          kubectl apply -f akamai-bookstore/k8s/sglang/
          kubectl apply -f akamai-bookstore/k8s/backend/
          kubectl apply -f akamai-bookstore/k8s/ai-service/
          kubectl apply -f akamai-bookstore/k8s/frontend/
          kubectl apply -f akamai-bookstore/k8s/ingress/

      - name: Roll out new images
        run: |
          SHA=${{ github.sha }}
          kubectl set image deployment/backend    backend=${{ env.IMAGE_PREFIX }}-backend:$SHA    -n bookstore
          kubectl set image deployment/ai-service ai-service=${{ env.IMAGE_PREFIX }}-ai-service:$SHA -n bookstore
          kubectl set image deployment/frontend   frontend=${{ env.IMAGE_PREFIX }}-frontend:$SHA   -n bookstore

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/backend    -n bookstore --timeout=5m
          kubectl rollout status deployment/ai-service -n bookstore --timeout=10m
          kubectl rollout status deployment/frontend   -n bookstore --timeout=5m

      - name: Seed catalog data
        run: |
          kubectl delete job bookstore-seed -n bookstore --ignore-not-found
          SHA=${{ github.sha }}
          sed "s|bookstore-seeder:latest|bookstore-seeder:$SHA|" \
            akamai-bookstore/k8s/jobs/seed-job.yaml | kubectl apply -f -
          kubectl wait job/bookstore-seed -n bookstore \
            --for=condition=complete --timeout=10m

      - name: Purge Akamai CDN cache
        run: |
          akamai purge invalidate \
            --urls "${{ vars.BOOKSTORE_URL }}/static/*" \
               "${{ vars.BOOKSTORE_URL }}/" \
            --network production \
            --edgerc <(echo "${{ secrets.AKAMAI_EDGERC }}")
        continue-on-error: true
